[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devresearchflow"
version = "0.3.0"
description = "Reviewed research workflows, execution evidence, and reproducibility checks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "DevResearchFlow contributors"}]
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["ruff>=0.12,<1", "mypy>=1.15,<3", "types-PyYAML", "tomli>=2; python_version < '3.11'", "hypothesis>=6,<7", "coverage>=7.10,<8", "build>=1,<2", "pytest>=8,<10"]
artwork = ["CairoSVG>=2.7,<3", "Pillow>=10.4,<13"]

[project.scripts]
drf = "devresearchflow.cli:main"

[project.urls]
Repository = "https://github.com/Shakthi-Bala/DevResearchFlow"

[tool.setuptools]
packages = ["devresearchflow", "devresearchflow.toolkit", "devresearchflow.toolkit.checks"]
package-dir = {devresearchflow = "src/devresearchflow", "devresearchflow.toolkit" = "workflows/research", "devresearchflow.toolkit.checks" = "workflows/research/checks"}
include-package-data = false

[tool.setuptools.package-data]
"devresearchflow.toolkit" = ["*.md", "VERSION", "LICENSE", "requirements.txt", "agents/*.md", "schemas/*.json", "templates/*", "integrations/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-include = ["bin/research-init"]
exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"workflows/research/tests/*.py" = ["E402"]
"examples/toy-ablation/build.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src/devresearchflow", "workflows/research/checks/provenance.py", "workflows/research/checks/execute.py", "workflows/research/checks/validate_records.py", "workflows/research/checks/record_helper.py"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
include = ["*/src/devresearchflow/*", "*/workflows/research/checks/*", "*/.research-toolkit/checks/*", "*/workflows/research/initialize.py"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.coverage.paths]
checks = ["workflows/research/checks", "*/.research-toolkit/checks"]
