name: Test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install toolkit and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run regression tests
        run: |
          python -m coverage run -m unittest discover -s workflows/research/tests -v
          python -m coverage combine
          python -m coverage report
          python -m coverage xml
      - name: Check shell syntax and whitespace
        run: |
          bash -n install.sh bin/graphify-init workflows/research/integrations/pre-commit
          git show --format= --check HEAD
      - name: Lint, format and type checks
        run: |
          ruff check .
          ruff format --check . bin/research-init
          mypy
          python scripts/render_record_states.py --check
      - name: Build distribution and smoke-test installed wheel
        run: |
          python -m build
          python -m venv /tmp/drf-wheel-test
          /tmp/drf-wheel-test/bin/python -m pip install dist/*.whl
          temp_project=$(mktemp -d)
          cd "$temp_project"
          git init -q
          /tmp/drf-wheel-test/bin/drf init . --no-hooks
          /tmp/drf-wheel-test/bin/drf status
          /tmp/drf-wheel-test/bin/drf check
