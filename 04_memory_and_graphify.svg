<text x="110" y="1550" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#14243b" text-anchor="start">Graphify stores the code map. Research files store the scientific evidence.</text>
<text x="110" y="1590" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#52637a" text-anchor="start">A structurally valid record can still be scientifically unsupported.</text>
<text x="110" y="1630" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Graph retrieval locates context; critical claims require inspecting the underlying evidence.</text>
