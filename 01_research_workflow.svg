<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2090" viewBox="0 0 1400 2090" role="img" aria-label="01  Research workflow">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,5 L0,10 Z" fill="#70849c"/></marker></defs>
<rect width="1400" height="2090" fill="#f5f8fc"/>
<text x="50" y="55" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#14243b" text-anchor="start">01  Research workflow</text>
<text x="50" y="91" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Seven roles. The same verifier reviews the protocol, implementation, and conclusions.</text>
<rect x="350" y="145" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="157" width="5" height="74" rx="2" fill="#245ac8"/>
<text x="372" y="179" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#245ac8" text-anchor="start">You</text>
<text x="372" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Question, constraints, budget</text>
<path d="M 690,243 L 690,290" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="290" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="302" width="5" height="74" rx="2" fill="#245ac8"/>
<text x="372" y="324" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#245ac8" text-anchor="start">1. Coordinator</text>
<text x="372" y="355" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Scope, dependencies, task contracts</text>
<path d="M 690,388 L 690,435" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="435" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="447" width="5" height="74" rx="2" fill="#087b73"/>
<text x="372" y="469" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#087b73" text-anchor="start">2. Literature researcher</text>
<text x="372" y="500" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Primary sources, exact passages, limitations</text>
<path d="M 690,533 L 690,580" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="580" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="592" width="5" height="74" rx="2" fill="#7552bd"/>
<text x="372" y="614" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#7552bd" text-anchor="start">3. Hypothesis researcher</text>
<text x="372" y="645" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Mechanisms, alternatives, falsification conditions</text>
<path d="M 690,678 L 690,725" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="725" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="737" width="5" height="74" rx="2" fill="#245ac8"/>
<text x="372" y="759" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#245ac8" text-anchor="start">4. Methodology designer</text>
<text x="372" y="790" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Baselines, metrics, splits, repetitions, budget</text>
<path d="M 690,823 L 690,870" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="870" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="882" width="5" height="74" rx="2" fill="#97601a"/>
<text x="372" y="904" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#97601a" text-anchor="start">6. Verifier — protocol review</text>
<text x="372" y="935" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Does this experiment test the intended hypothesis?</text>
<path d="M 690,968 L 690,1015" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="1015" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="1027" width="5" height="74" rx="2" fill="#087b73"/>
<text x="372" y="1049" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#087b73" text-anchor="start">5. Engineer</text>
<text x="372" y="1080" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Implement the specified method and checks</text>
<path d="M 690,1113 L 690,1160" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="1160" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="1172" width="5" height="74" rx="2" fill="#97601a"/>
<text x="372" y="1194" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#97601a" text-anchor="start">6. Verifier — implementation review</text>
<text x="372" y="1225" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Equations, units, frames, data flow, evaluation logic</text>
<path d="M 690,1258 L 690,1305" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="1305" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="1317" width="5" height="74" rx="2" fill="#087b73"/>
<text x="372" y="1339" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#087b73" text-anchor="start">Engineer — execution</text>
<text x="372" y="1370" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Record manifests, resolved config, logs, outputs</text>
<path d="M 690,1403 L 690,1450" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="1450" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="1462" width="5" height="74" rx="2" fill="#7552bd"/>
<text x="372" y="1484" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#7552bd" text-anchor="start">7. Analyst</text>
<text x="372" y="1515" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Reproducible measurements and scoped interpretation</text>
<path d="M 690,1548 L 690,1595" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="1595" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="1607" width="5" height="74" rx="2" fill="#97601a"/>
<text x="372" y="1629" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#97601a" text-anchor="start">6. Verifier — evidence review</text>
<text x="372" y="1660" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Check support, counterevidence, and uncertainty</text>
<path d="M 690,1693 L 690,1740" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="350" y="1740" width="680" height="98" rx="14" fill="white" stroke="#ccd8e7" stroke-width="2"/>
<rect x="350" y="1752" width="5" height="74" rx="2" fill="#245ac8"/>
<text x="372" y="1774" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#245ac8" text-anchor="start">Coordinator — outcome and decision</text>
<text x="372" y="1805" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#52637a" text-anchor="start">Preserve supported, negative, and inconclusive outcomes</text>
<path d="M 350,919 L 220,919 L 220,774 L 350,774" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="55" y="830" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52637a" text-anchor="start">Revise protocol</text>
<path d="M 1030,1209 L 1160,1209 L 1160,1064 L 1030,1064" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1180" y="1117" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52637a" text-anchor="start">Fix code</text>
<path d="M 1030,1644 L 1160,1644 L 1160,1499 L 1030,1499" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1140" y="1555" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52637a" text-anchor="start">Correct analysis</text>
<path d="M 350,1644 L 120,1644 L 120,735 L 350,735" fill="none" stroke="#70849c" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="130" y="1350" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#52637a" text-anchor="start">More evidence</text>
<text x="350" y="1935" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#14243b" text-anchor="start">Coordinator returns the outcome and next decision to you.</text>
<text x="350" y="1972" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52637a" text-anchor="start">Failed or interrupted runs are preserved immediately.</text>
<text x="350" y="2009" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#52637a" text-anchor="start">Routine work proceeds within the agreed scope and budget.</text>
</svg>